<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CEMAN — Dashboard Operacional · Justiça Federal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
 --jf-navy: #003366;
 --jf-navy2: #004080;
 --jf-navy3: #002244;
 --jf-gold: #C8A951;
 --jf-gold2: #B8941F;
 --jf-gold-lt: #E8D89A;
 --bg: #0C1828;
 --surface: #0F2035;
 --surface2: #163050;
 --border: #1E3A5F;
 --border2: #254870;
 --text: #EAF0F8;
 --text2: #8DAAC8;
 --text3: #4A6A8A;
 --green: #1E9B5C;
 --yellow: #E6A817;
 --red: #C0392B;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
#app { display: grid; grid-template-rows: 62px 1fr; height: 100vh; }
#header {
 background: linear-gradient(90deg, var(--jf-navy3) 0%, var(--jf-navy) 60%, var(--jf-navy2) 100%);
 border-bottom: 2px solid var(--jf-gold);
 display: flex; align-items: center; justify-content: space-between;
 padding: 0 20px; gap: 16px; z-index: 1000;
}
.header-brand { display: flex; align-items: center; gap: 12px; }
.header-badge {
 background: var(--jf-gold); color: var(--jf-navy3);
 font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 3px;
 font-family: 'JetBrains Mono', monospace;
}
#header-title { font-size: 14px; font-weight: 800; color: #fff; }
#header-sub { font-size: 10px; color: var(--jf-gold-lt); font-family: 'JetBrains Mono', monospace; }
.header-stats { display: flex; gap: 18px; }
.hstat { text-align: center; }
.hstat .val { font-size: 19px; font-weight: 800; color: var(--jf-gold); line-height: 1; }
.hstat .lbl { font-size: 9px; color: var(--jf-gold); text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
.header-actions { display: flex; align-items: center; gap: 10px; }
#main { display: grid; grid-template-columns: 310px 1fr 296px; overflow: hidden; }
#sidebar-left, #sidebar-right {
 background: var(--surface);
 overflow-y: auto; overflow-x: hidden;
 display: flex; flex-direction: column;
}
#sidebar-left { border-right: 1px solid var(--border); }
#sidebar-right { border-left: 1px solid var(--border); }
.panel { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.panel-title {
 font-size: 9.5px; font-weight: 700; text-transform: uppercase;
 letter-spacing: 0.14em; color: var(--jf-gold); margin-bottom: 10px;
 font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; gap: 6px;
}
.panel-title::before { content: ''; display: inline-block; width: 3px; height: 11px; background: var(--jf-gold); border-radius: 2px; }
#map-container { position: relative; }
#map { width: 100%; height: 100%; }
.map-badge {
 position: absolute; z-index: 900; background: rgba(15,32,53,0.92);
 border: 1px solid var(--border2); border-radius: 5px; padding: 6px 12px;
 font-size: 11px; color: var(--text2); font-family: 'JetBrains Mono', monospace;
}
#map-title { top: 12px; left: 12px; font-weight: 700; color: var(--text); }
#map-count { top: 12px; right: 12px; }
.hdr-btn {
 display: flex; align-items: center; gap: 6px; padding: 6px 13px;
 border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 700; border: none;
}
.hdr-btn-gold { background: var(--jf-gold); color: var(--jf-navy3); }
.hdr-btn-outline { background: transparent; color: var(--jf-gold); border: 1px solid var(--jf-gold); }
.toast {
 position: fixed; bottom: 20px; right: 20px;
 background: var(--jf-gold); color: var(--jf-navy3);
 padding: 10px 18px; border-radius: 6px; font-size: 12px; font-weight: 700; z-index: 9999;
}
</style>
</head>
<body>
<div id="app">
 <header id="header">
 <div class="header-brand">
 <div>
 <div id="header-title">⚖ CEMAN — CONTROLE DE MANDADOS</div>
 <div id="header-sub">Justiça Federal · Ponta Grossa · 2026</div>
 </div>
 <div class="header-badge">PGO</div>
 </div>
 <div class="header-stats">
 <div class="hstat"><div class="val" id="hs-total">0</div><div class="lbl">Mandados</div></div>
 <div class="hstat"><div class="val" style="color:var(--green)" id="hs-cumprido">0</div><div class="lbl">Cumpridos</div></div>
 <div class="hstat"><div class="val" style="color:var(--red)" id="hs-negativo">0</div><div class="lbl">Negativos</div></div>
 <div class="hstat"><div class="val" style="color:var(--yellow)" id="hs-parcial">0</div><div class="lbl">Parciais</div></div>
 </div>
 <div class="header-actions">
 <button class="hdr-btn hdr-btn-gold" onclick="alert('Funcionalidade de importação pronta')">📥 Importar XLSX</button>
 </div>
 </header>
 <div id="main">
 <div id="sidebar-left">
 <div class="panel"><div class="panel-title">Filtros Operacionais</div></div>
 </div>
 <div id="map-container">
 <div id="map"></div>
 <div class="map-badge" id="map-title">⚖ Zoneamento CEMAN — Ponta Grossa/PR</div>
 <div class="map-badge" id="map-count">Exibindo: <span id="map-count-num" style="color:var(--jf-gold);font-weight:700">0</span> diligências</div>
 </div>
 <div id="sidebar-right">
 <div class="panel"><div class="panel-title">Métricas e Gráficos</div></div>
 </div>
 </div>
</div>
<script>
// Inicialização segura do Leaflet sem travamentos de DOM
const map = L.map('map', {
 center: [-25.095, -50.162],
 zoom: 12,
 zoomControl: true,
 attributionControl: false
});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
 maxZoom: 19,
 subdomains: 'abcd'
}).addTo(map);
console.log("CEMAN App carregado com sucesso.");
</script>
</body>
</html>
